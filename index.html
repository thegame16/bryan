<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{
  --pink:#FF4D8D; --orange:#FFA53E; --yellow:#FFD23F; --teal:#2EC4B6; --purple:#8C6FFF;
  --cream:#FFF8EF; --ink:#2E2233; --muted:#8a7f8f;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--cream); color:var(--ink); font-family:'Poppins',sans-serif; overflow-x:hidden;}
::selection{ background:var(--yellow); }

.wrap{ max-width:560px; margin:0 auto; padding:26px 22px 70px; position:relative; }

/* faint photo backdrop */
.backdrop{ position:fixed; inset:0; z-index:-2; overflow:hidden; background:var(--cream); }
.backdrop .slide{
  position:absolute; inset:0; background-size:cover; background-position:center;
  filter:blur(7px) saturate(1.05); opacity:0; animation:slideFade 18s ease-in-out infinite;
}
.backdrop .slide:nth-child(1){ background-image:url('photos/photo1.jpg'); animation-delay:0s; }
.backdrop .slide:nth-child(2){ background-image:url('photos/photo2.jpg'); animation-delay:6s; }
.backdrop .slide:nth-child(3){ background-image:url('photos/photo3.jpg'); animation-delay:12s; }
@keyframes slideFade{ 0%{opacity:0;} 6%{opacity:.22;} 30%{opacity:.22;} 38%{opacity:0;} 100%{opacity:0;} }
.backdrop .tint{
  position:absolute; inset:0;
  background:linear-gradient(180deg, var(--cream) 0%, rgba(255,248,239,.75) 30%, rgba(255,248,239,.75) 70%, var(--cream) 100%);
}
@media (prefers-reduced-motion:reduce){
  .backdrop .slide{ animation:none; opacity:0; }
  .backdrop .slide:nth-child(1){ opacity:.18; }
}

/* balloons */
.balloons{ position:absolute; inset:0; height:340px; pointer-events:none; overflow:hidden; }
.balloon{ position:absolute; width:46px; height:58px; border-radius:50% 50% 50% 50% / 55% 55% 45% 45%; animation:drift 6s ease-in-out infinite; }
.balloon:after{ content:""; position:absolute; left:50%; top:100%; width:1px; height:34px; background:#d8cfd6; }
.b1{ background:var(--pink); left:6%; top:18px; animation-delay:0s; }
.b2{ background:var(--teal); left:78%; top:0; animation-delay:1.3s; }
.b3{ background:var(--yellow); left:44%; top:36px; animation-delay:2.6s; }
.b4{ background:var(--purple); left:88%; top:70px; animation-delay:.8s; }
@keyframes drift{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-14px) rotate(3deg);} }
@media (prefers-reduced-motion:reduce){ .balloon{ animation:none; } }

/* hero */
.hero{ text-align:center; padding-top:150px; }
h1{
  font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(34px,9vw,54px);
  line-height:1.08; margin:0 0 12px; outline:none;
  background:linear-gradient(90deg,var(--pink),var(--orange) 35%,var(--purple) 70%,var(--teal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
h1[contenteditable]:empty:before{ content:attr(data-placeholder); -webkit-text-fill-color:var(--muted); color:var(--muted); }
.subtitle{ font-size:16px; color:#6b5f70; margin:0 0 34px; outline:none; }
.subtitle[contenteditable]:empty:before{ content:attr(data-placeholder); color:var(--muted); }

/* cake */
.cake-wrap{ display:flex; justify-content:center; margin-bottom:10px; }
#cakeBtn{ background:none; border:none; cursor:pointer; padding:10px; }
#cakeBtn:focus-visible{ outline:2px solid var(--purple); outline-offset:6px; border-radius:8px; }
.flame{ transform-origin:50% 100%; animation:flick 2.2s ease-in-out infinite; }
.flame.out{ opacity:0; transform:scaleY(0.2); transition:.4s ease; }
@keyframes flick{ 0%,100%{transform:scaleY(1) rotate(0);} 50%{transform:scaleY(1.08) rotate(3deg);} }
@media (prefers-reduced-motion:reduce){ .flame{ animation:none; } }
.hint{ text-align:center; font-size:13px; color:var(--muted); margin:0 0 46px; }

/* gallery */
.gallery-label{ text-align:center; font-family:'Fredoka',sans-serif; font-weight:500; font-size:15px; color:var(--purple); margin:0 0 18px; }
.gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px 12px; margin-bottom:44px; }
.polaroid{
  background:#fff; padding:8px 8px 22px; border-radius:3px; box-shadow:0 6px 14px rgba(46,34,51,0.12);
  cursor:pointer; position:relative;
}
.polaroid:nth-child(3n+1){ transform:rotate(-4deg); }
.polaroid:nth-child(3n+2){ transform:rotate(3deg); }
.polaroid:nth-child(3n){ transform:rotate(-2deg); }
.polaroid .tape{
  position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-4deg);
  width:34px; height:14px; opacity:.75;
}
.polaroid:nth-child(1) .tape{ background:var(--pink); }
.polaroid:nth-child(2) .tape{ background:var(--teal); }
.polaroid:nth-child(3) .tape{ background:var(--yellow); }
.polaroid:nth-child(4) .tape{ background:var(--purple); }
.polaroid:nth-child(5) .tape{ background:var(--orange); }
.polaroid:nth-child(6) .tape{ background:var(--pink); }
.frame-inner{
  width:100%; aspect-ratio:1/1; background:#f3eef6; display:flex; align-items:center; justify-content:center;
  background-size:cover; background-position:center;
}
.frame-inner .plus{ font-size:22px; color:#c8bed0; }
.polaroid.filled .plus{ display:none; }
input[type=file]{ display:none; }

/* closing */
.closing{ text-align:center; }
.message{
  font-family:'Fredoka', sans-serif; font-weight:500; font-size:19px; line-height:1.5;
  color:var(--ink); margin:0 0 20px; outline:none;
}
.message[contenteditable]:empty:before{ content:attr(data-placeholder); color:var(--muted); font-family:'Poppins',sans-serif; font-weight:400; }
.from{ font-size:13px; color:var(--muted); outline:none; margin:0 0 6px; }
.from[contenteditable]:empty:before{ content:attr(data-placeholder); }
.dots{ display:flex; justify-content:center; gap:8px; margin-top:24px; }
.dots span{ width:7px; height:7px; border-radius:50%; }
.dots span:nth-child(1){ background:var(--pink); } .dots span:nth-child(2){ background:var(--orange); }
.dots span:nth-child(3){ background:var(--yellow); } .dots span:nth-child(4){ background:var(--teal); } .dots span:nth-child(5){ background:var(--purple); }

.note{ text-align:center; font-size:11px; color:#c7bccb; margin-top:34px; }
</style>
</head>
<body>

<div class="backdrop">
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="tint"></div>
</div>

<div class="wrap">
  <div class="balloons">
    <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div><div class="balloon b4"></div>
  </div>

  <div class="hero">
    <h1 contenteditable="true" spellcheck="false" data-placeholder="Happy Birthday, You!" id="name">Happy Birthday, You!</h1>
    <p class="subtitle" contenteditable="true" spellcheck="false" data-placeholder="here's to another amazing year" id="subtitle">here's to another amazing year</p>
  </div>

  <div class="cake-wrap">
    <button id="cakeBtn" aria-label="Blow out the candles">
      <svg width="140" height="110" viewBox="0 0 140 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="flame" d="M40 20c0 0-6 8-6 13s2.7 8 6 8 6-3.6 6-8-6-13-6-13Z" fill="var(--yellow)"/>
        <path class="flame" d="M70 14c0 0-6 8-6 13s2.7 8 6 8 6-3.6 6-8-6-13-6-13Z" fill="var(--pink)"/>
        <path class="flame" d="M100 20c0 0-6 8-6 13s2.7 8 6 8 6-3.6 6-8-6-13-6-13Z" fill="var(--teal)"/>
        <rect x="37" y="41" width="6" height="16" fill="#fff"/>
        <rect x="67" y="35" width="6" height="22" fill="#fff"/>
        <rect x="97" y="41" width="6" height="16" fill="#fff"/>
        <path d="M15 60c0-8 8-14 20-14h70c12 0 20 6 20 14v8H15v-8Z" fill="var(--purple)"/>
        <rect x="10" y="68" width="120" height="34" rx="6" fill="#fff" stroke="#f0e8f2" stroke-width="2"/>
        <rect x="10" y="68" width="120" height="10" fill="var(--pink)" opacity=".5"/>
      </svg>
    </button>
  </div>
  <p class="hint" id="hint">tap the cake to make a wish</p>

  <p class="gallery-label">the fun bunch 🎉</p>
  <div class="gallery" id="gallery"></div>

  <div class="closing">
    <p class="message" contenteditable="true" spellcheck="false" data-placeholder="Write your birthday message here…" id="message">Wishing you the happiest of days — click to write your own note!</p>
    <p class="from" contenteditable="true" spellcheck="false" data-placeholder="— from all of us" id="from">— from all of us</p>
    <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <p class="note">click any text to personalize · tap a photo square to add a picture</p>
</div>

<script>
const KEY = 'birthday-bash-v1';
const PHOTO_COUNT = 6;
const gallery = document.getElementById('gallery');
const textFields = ['name','subtitle','message','from'];

function buildGallery(photos){
  gallery.innerHTML = '';
  for(let i=0;i<PHOTO_COUNT;i++){
    const p = document.createElement('div');
    p.className = 'polaroid';
    p.innerHTML = `<div class="tape"></div><div class="frame-inner"><span class="plus">+</span></div><input type="file" accept="image/*">`;
    const inner = p.querySelector('.frame-inner');
    const input = p.querySelector('input');
    if(photos[i]){
      inner.style.backgroundImage = `url(${photos[i]})`;
      p.classList.add('filled');
    }
    p.addEventListener('click', ()=> input.click());
    input.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        inner.style.backgroundImage = `url(${reader.result})`;
        p.classList.add('filled');
        savePhoto(i, reader.result);
      };
      reader.readAsDataURL(file);
    });
    gallery.appendChild(p);
  }
}

const DEFAULT_PHOTOS = ['photos/photo1.jpg','photos/photo2.jpg','photos/photo3.jpg'];

function loadAll(){
  let data = {};
  try{ data = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  textFields.forEach(id=>{ if(data[id]) document.getElementById(id).innerText = data[id]; });
  const photos = (data.photos && data.photos.length) ? data.photos : DEFAULT_PHOTOS;
  buildGallery(photos);
}
function saveText(){
  let data = {};
  try{ data = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  textFields.forEach(id=>{ data[id] = document.getElementById(id).innerText; });
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
}
function savePhoto(i, dataUrl){
  let data = {};
  try{ data = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  const photos = data.photos || [];
  photos[i] = dataUrl; data.photos = photos;
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
}
textFields.forEach(id=> document.getElementById(id).addEventListener('input', saveText));
loadAll();

let blown = false;
document.getElementById('cakeBtn').addEventListener('click', ()=>{
  blown = !blown;
  document.querySelectorAll('.flame').forEach(f=> f.classList.toggle('out', blown));
  document.getElementById('hint').textContent = blown ? 'wish made! tap to relight' : 'tap the cake to make a wish';
  if(blown && typeof confetti === 'function'){
    confetti({ particleCount:120, spread:80, origin:{ y:0.6 }, colors:['#FF4D8D','#FFA53E','#FFD23F','#2EC4B6','#8C6FFF'] });
  }
});
</script>
</body>
</html>
